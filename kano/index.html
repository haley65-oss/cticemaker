<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>制冰机 App 功能卡诺模型图</title>
  <style>
    :root {
      --ink: #172033;
      --muted: #667085;
      --panel: #ffffff;
      --bg: #f5f7fb;
      --must: #fee2e2;
      --expect: #dcfce7;
      --opportunity: #e0f2fe;
      --watch: #f3f4f6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      letter-spacing: 0;
    }

    main {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 34px;
    }

    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: end;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(24px, 3vw, 38px);
      line-height: 1.18;
      font-weight: 800;
    }

    .subhead {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    button {
      min-height: 38px;
      border: 1px solid #cfd7e6;
      border-radius: 8px;
      background: #fff;
      color: #1f2937;
      padding: 8px 12px;
      font: inherit;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
    }

    button:hover {
      background: #eef4ff;
      border-color: #93b4ea;
    }

    button:active {
      transform: translateY(1px);
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 16px;
      align-items: start;
    }

    .chart-panel,
    .side-panel {
      background: var(--panel);
      border: 1px solid #e3e8f1;
      border-radius: 8px;
      box-shadow: 0 14px 36px rgba(20, 28, 45, 0.08);
    }

    .chart-panel {
      padding: 16px;
      overflow: hidden;
    }

    #chart {
      display: block;
      width: 100%;
      height: auto;
      min-height: 560px;
    }

    .side-panel {
      padding: 16px;
    }

    .side-panel h2 {
      margin: 0 0 12px;
      font-size: 16px;
      line-height: 1.4;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 14px;
    }

    .metric {
      border: 1px solid #e5eaf3;
      border-radius: 8px;
      padding: 10px;
      background: #fafcff;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }

    .metric strong {
      display: block;
      margin-top: 4px;
      font-size: 20px;
    }

    .legend {
      display: grid;
      gap: 9px;
      margin: 14px 0;
      padding: 0;
      list-style: none;
    }

    .legend li {
      display: grid;
      grid-template-columns: 14px 1fr;
      gap: 8px;
      align-items: center;
      color: #344054;
      font-size: 13px;
      line-height: 1.4;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1px solid rgba(0, 0, 0, 0.18);
    }

    .notes {
      margin: 14px 0 0;
      padding: 12px;
      border-left: 4px solid #7aa7df;
      background: #f3f8ff;
      color: #344054;
      font-size: 13px;
      line-height: 1.65;
    }

    .tooltip {
      position: fixed;
      pointer-events: none;
      z-index: 10;
      max-width: 280px;
      padding: 10px 12px;
      border: 1px solid #d5dce8;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.98);
      box-shadow: 0 14px 32px rgba(20, 28, 45, 0.18);
      color: #172033;
      font-size: 13px;
      line-height: 1.55;
      opacity: 0;
      transform: translate(-50%, calc(-100% - 14px));
